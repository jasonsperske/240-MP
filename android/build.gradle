// 240-MP's Android build. androiddeployqt copies this directory (QT_ANDROID_PACKAGE_SOURCE_DIR in
// CMakeLists.txt) over Qt 6.4's Gradle template and runs it; this file replaces the template's
// build.gradle. Qt 6.4.3 is the last Qt whose Android support reaches Android 7.0 (API 24), the
// gen 1 Peloton Bike's tablet, so the toolchain is pinned to what it ships: Gradle 7.4.2 and
// AGP 7.2.1, with Kotlin 2.0.21 (the newest Kotlin that supports that pair).
//
// The Kotlin libraries can be built and tested without Qt, from the repository root:
//   scripts/android-kotlin-tests.sh
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // A newer D8/R8 ahead of AGP's own: AGP 7.2's dexer (3.2.60) crashes on enum classes
        // in current libraries (smbj, slf4j). Must come before the AGP line.
        classpath 'com.android.tools:r8:8.2.47'
        classpath 'com.android.tools.build:gradle:7.2.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// androiddeployqt writes qtAndroidDir (and the SDK levels below) into gradle.properties. Without
// it this is a standalone run for the libraries' tests: there is no app to configure, and the
// outputs go under the repository's build/ (androiddeployqt copies this whole directory into
// its Gradle build, so nothing may be written here).
if (!project.hasProperty('qtAndroidDir')) {
    allprojects {
        buildDir = new File(rootDir, "../build/android-kotlin/${project.name}")
    }
    return
}

apply plugin: 'com.android.application'

// libVLC ships its own libc++_shared.so, and androiddeployqt copies Qt's (NDK 23) into libs/. An
// APK holds one per ABI, and it has to be the newer of the two: code built against an older
// libc++ runs on a newer one, not the other way round. libVLC 3.6.5's is newer (clang 18, NDK r27)
// for the 64-bit ABIs, but older (clang 9) for the 32-bit ones. So for arm64-v8a and x86_64 drop
// Qt's copy (this is androiddeployqt's build directory, not the source tree); for armeabi-v7a and
// x86 keep Qt's, which the packaging below picks over libVLC's.
['arm64-v8a', 'x86_64'].each { abi -> file("libs/${abi}/libc++_shared.so").delete() }
apply plugin: 'org.jetbrains.kotlin.android'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation project(':bike')
    implementation project(':exercise-core')
    // Media3 1.1.x is the newest line that builds against compileSdk 33 / AGP 7.2.
    implementation 'androidx.media3:media3-exoplayer:1.1.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.1.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.1.1'
    implementation 'androidx.media3:media3-ui:1.1.1'
    // SMB 2/3 for the Network Shares module (Apache-2.0). Its BouncyCastle provider supplies the
    // MD4 that NTLM sign-in needs and Android's own crypto lacks.
    implementation 'com.hierynomus:smbj:0.15.0'
    // The fallback player for what ExoPlayer can't decode on Android 7 (XviD/DivX AVIs, Theora,
    // MJPEG): libVLC (LGPL-2.1+). 3.6.5 is the newest that needs neither compileSdk 36 nor a
    // Kotlin newer than this build's.
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    // java.time on Android 7 (smbj's FileTime refers to Instant, which arrived in API 26).
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.9'
}

android {
    namespace 'com.mp240.app'
    // Pinned rather than taken from androiddeployqt (which picks the newest platform installed):
    // AGP 7.2.1 cannot build against the newest SDKs. Install with
    //   sdkmanager "platforms;android-33" "build-tools;33.0.2"
    compileSdkVersion 33
    buildToolsVersion '33.0.2'
    ndkVersion androidNdkVersion

    // Extract native libraries from the APK
    packagingOptions.jniLibs.useLegacyPackaging true

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    // 32-bit ABIs: Qt's libc++_shared.so and libVLC's are both present; keep the first, Qt's
    // (the app's own jniLibs come before its dependencies'). See the note at the top.
    packagingOptions.jniLibs.pickFirsts += ['lib/armeabi-v7a/libc++_shared.so', 'lib/x86/libc++_shared.so']

    // BouncyCastle (via smbj) and slf4j ship multi-release jar metadata Android doesn't use.
    packagingOptions {
        resources.excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lintOptions {
        abortOnError false
    }

    // Do not compress Qt binary resources file
    aaptOptions {
        noCompress 'rcc'
    }

    defaultConfig {
        resConfig "en"
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")
    }
}
